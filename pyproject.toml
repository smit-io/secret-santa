[project]
name = "secret-santa"
version = "0.2.0"
description = "Constraint-based Secret Santa solver using graph matching"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "networkx>=3.6.1",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "faker>=40.12.0",
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "ruff>=0.15.8",
    "types-networkx>=3.6.1.20260321",
]
